<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 实时编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 默认主题（白天模式） */
            --bg-color: #f5f5f5;
            --text-color: #333;
            --header-bg: #fff;
            --header-text: #333;
            --button-bg: #c4c4c4;
            --button-hover: #939393;
            --editor-bg: #fff;
            --border-color: #ddd;
            --code-bg: #f6f8fa;
            --blockquote-color: #6a737d;
            --blockquote-border: #dfe2e5;
            --dropdown-bg: #fff;
            --dropdown-shadow: 0 8px 16px rgba(0,0,0,0.1);
            --dropdown-hover-bg: #f1f1f1;
        }

        /* 黑夜模式 */
        body.theme-dark {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --header-bg: #121212;
            --header-text: #f0f0f0;
            --button-bg: #2c3e50;
            --button-hover: #34495e;
            --editor-bg: #2d2d2d;
            --border-color: #444;
            --code-bg: #383838;
            --blockquote-color: #aaa;
            --blockquote-border: #666;
            --dropdown-bg: #3e3e3e;
            --dropdown-shadow: 0 8px 16px rgba(0,0,0,0.3);
            --dropdown-hover-bg: #555;
        }

        /* 蓝色模式 */
        body.theme-blue {
            --bg-color: #e8f4f8;
            --text-color: #2c3e50;
            --header-bg: #1e88e5;
            --header-text: white;
            --button-bg: #0d47a1;
            --button-hover: #1565c0;
            --editor-bg: #f1f8fe;
            --border-color: #bbdefb;
            --code-bg: #e3f2fd;
            --blockquote-color: #546e7a;
            --blockquote-border: #64b5f6;
            --dropdown-bg: #ffffff;
            --dropdown-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            --dropdown-hover-bg: #e3f2fd;
        }

        /* 赛博朋克模式 */
        body.theme-cyberpunk {
            --bg-color: #0a0a16;
            --text-color: #f0f2f5;
            --header-bg: #120458;
            --header-text: #00ff9f;
            --button-bg: #9900ff;
            --button-hover: #b14aff;
            --editor-bg: #1a1a2e;
            --border-color: #ff00ff;
            --code-bg: #2d1b54;
            --blockquote-color: #00fff9;
            --blockquote-border: #ff00ff;
            --dropdown-bg: #1a1a2e;
            --dropdown-shadow: 0 5px 15px rgba(255, 0, 255, 0.3);
            --dropdown-hover-bg: #2d1b54;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0 auto;
        }

        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.1rem;
            margin: 0;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--button-bg);
            color: var(--header-text);
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--button-hover);
        }
        
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        /* --- Dropdown Menu Styles --- */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            background-color: var(--dropdown-bg);
            min-width: 160px;
            box-shadow: var(--dropdown-shadow);
            z-index: 1;
            border-radius: 4px;
            padding: 5px 0;
            margin-top: 5px;
        }

        .dropdown-menu button {
            color: var(--text-color);
            background-color: transparent;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            border-radius: 0;
        }

        .dropdown-menu button:hover {
            background-color: var(--dropdown-hover-bg);
        }

        .dropdown-menu.show {
            display: block;
        }
        /* --- End Dropdown Styles --- */

        .theme-selector {
            margin-left: 10px;
        }

        #themeSelector {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px var(--border-color);
            background-color: var(--editor-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
            outline: none;
        }

        main {
            display: flex;
            flex: 1;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }

        .editor-container,
        .preview-container {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            height: 100%;
            transition: flex 0.3s ease-in-out, opacity 0.3s ease-in-out, display 0.3s ease-in-out;
            min-width: 0;
        }

        /* 修复编辑区/预览区隐藏样式 */
        main.editor-hidden .editor-container {
            flex: 0;
            display: none;
            opacity: 0;
        }
        main.preview-hidden .preview-container {
            flex: 0;
            display: none;
            opacity: 0;
        }

        .editor-container {
            background-color: var(--editor-bg);
            border-right: 1px solid var(--border-color);
            border-radius: 0;
            padding: 1rem;
        }

        .preview-container {
            background-color: var(--editor-bg);
            padding: 1rem;
        }

        #editor {
            width: 100%;
            height: 100%;
            border: none;
            resize: none;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            line-height: 1.6;
            padding: 4px 10px;
            outline: none;
            background-color: transparent;
            color: var(--text-color);
        }

        #editor::-webkit-scrollbar {
            height: 6px;
            width: 0 !important;
            background: transparent;
        }
        #editor {
            scrollbar-width: thin; /* Firefox */
            -ms-overflow-style: none; /* IE 10+ */
        }

        .markdown-body {
            padding: 10px;
            line-height: 1.6;
        }

        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin-top: 1.5rem; margin-bottom: 1rem; font-weight: 600; line-height: 1.25; }
        .markdown-body h1 { font-size: 2em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .markdown-body p { margin-top: 0; margin-bottom: 1rem; }
        .markdown-body blockquote { padding: 0 1em; color: var(--blockquote-color); border-left: 0.25em solid var(--blockquote-border); margin: 0 0 1rem 0; }
        .markdown-body pre { background-color: var(--code-bg); border-radius: 3px; padding: 16px; overflow: auto; margin-bottom: 1rem; }
        .markdown-body pre code { padding: 0; background-color: transparent; }
        .markdown-body code { font-family: 'Consolas', monospace; background-color: var(--code-bg); padding: 0.2em 0.4em; border-radius: 3px; }
        .markdown-body img { max-width: 100%; }
        .markdown-body ul, .markdown-body ol { padding-left: 2em; margin-bottom: 1rem; }
        .markdown-body table { border-collapse: collapse; margin-bottom: 1rem; display: block; overflow: auto; width: 100%; }
        .markdown-body th, .markdown-body td { padding: 6px 13px; border: 1px solid var(--border-color); }

        .editor-container::-webkit-scrollbar,
        .preview-container::-webkit-scrollbar {
            width: 0 !important;
            background-color: transparent;
        }
        .editor-container,
        .preview-container {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            main { flex-direction: column; }
            .editor-container, .preview-container { flex: none; height: 50%; width: 100%; }
            .editor-container { border-right: none; border-bottom: 1px solid var(--border-color); }
            /* 移动端隐藏样式修复 */
            main.preview-hidden .editor-container { height: 100%; border-bottom: none; display: block; opacity: 1; }
            main.editor-hidden .preview-container { height: 100%; border-bottom: none; display: block; opacity: 1; }
            main.editor-hidden .editor-container { height: 0; display: none; opacity: 0; }
            main.preview-hidden .preview-container { height: 0; display: none; opacity: 0; }
        }

        .sync-scroll-toggle {
            display: flex;
            align-items: center;
            margin-left: 18px;
            font-size: 13px;
            color: var(--header-text);
            user-select: none;
        }
        .sync-scroll-toggle input[type="checkbox"] {
            accent-color: var(--button-bg);
            margin-right: 4px;
            width: 16px;
            height: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Markdown 实时编辑器</h1>
            <div class="toolbar">
                <button id="loadSitesBtn" style="background:#0071e3;color:white">加载 sites</button>
                <button id="saveToGithubBtn" style="background:#0071e3;color:white">保存到 Nav</button>

                <button id="saveBtn">保存</button>
                <button id="importBtn">导入 MD</button>
                <div class="dropdown">
                    <button class="dropdown-toggle">导出</button>
                    <div id="export-menu" class="dropdown-menu">
                        <button id="exportBtn">导出 MD</button>
                        <button id="exportHtmlBtn">导出 HTML</button>
                        <button id="exportPdfBtn">导出 PDF</button>
                    </div>
                </div>

                <div class="dropdown">
                    <button class="dropdown-toggle">视图</button>
                    <div id="view-menu" class="dropdown-menu">
                        <button id="toggleEditorBtn">切换编辑区</button>
                        <button id="togglePreviewBtn">切换预览区</button>
                        <button id="mdGuideBtn">Markdown 指南</button>
                    </div>
                </div>

                <div class="theme-selector">
                    <select id="themeSelector">
                        <option value="default">白天模式</option>
                        <option value="dark">黑夜模式</option>
                        <option value="blue">蓝色模式</option>
                        <option value="cyberpunk">赛博朋克</option>
                    </select>
                </div>
                <label class="sync-scroll-toggle">
                    <input type="checkbox" id="syncScrollToggle" checked> 同步滚动
                </label>
            </div>
        </header>
        <main>
            <div class="editor-container">
                <textarea id="editor" placeholder="在此输入 Markdown 内容..."></textarea>
            </div>
            <div class="preview-container">
                <div id="preview" class="markdown-body"></div>
            </div>
        </main>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        window.addEventListener('load', function () {
            const editor = document.getElementById('editor');
            const preview = document.getElementById('preview');
            const mainContainer = document.querySelector('main');
            const syncScrollToggle = document.getElementById('syncScrollToggle');
            const themeSelector = document.getElementById('themeSelector');
            const dropdownToggles = document.querySelectorAll('.dropdown-toggle');

            const saveBtn = document.getElementById('saveBtn');
            const importBtn = document.getElementById('importBtn');
            const exportBtn = document.getElementById('exportBtn');
            const exportHtmlBtn = document.getElementById('exportHtmlBtn');
            const exportPdfBtn = document.getElementById('exportPdfBtn');
            const toggleEditorBtn = document.getElementById('toggleEditorBtn');
            const togglePreviewBtn = document.getElementById('togglePreviewBtn');
            const mdGuideBtn = document.getElementById('mdGuideBtn');

            let isShowingGuide = false;
            let userContentBeforeGuide = '';

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.md,.markdown,text/markdown';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            marked.setOptions({ breaks: true, gfm: true, headerIds: true, sanitize: false });

            function renderMarkdown(shouldSave = true) {
                const markdownText = editor.value;
                const htmlContent = marked.parse(markdownText);
                preview.innerHTML = htmlContent;
                if (shouldSave && !isShowingGuide) {
                    localStorage.setItem('markdown-content', markdownText);
                }
            }
            
            function getFilename() {
                const firstLine = editor.value.trim().split('\n')[0];
                const sanitized = firstLine.replace(/[^a-zA-Z0-9\u4e00-\u9fa5\s]/g, '').trim();
                return sanitized && sanitized.length > 0 ? sanitized : 'markdown-export';
            }

            // ==============================================
            // 【绝对无自动加载】初始化只加载本地缓存
            // ==============================================
            const savedContent = localStorage.getItem('markdown-content');
            if (savedContent) editor.value = savedContent;
            renderMarkdown(false);

            const initialTheme = localStorage.getItem('markdown-theme') || 'default';
            document.body.className = '';
            document.body.classList.add(`theme-${initialTheme}`);
            themeSelector.value = initialTheme;

            // 编辑事件
            editor.addEventListener('input', () => {
                if (isShowingGuide) {
                    isShowingGuide = false;
                    mdGuideBtn.textContent = 'Markdown 指南';
                }
                renderMarkdown(true);
            });

            // 保存
            saveBtn.addEventListener('click', () => {
                localStorage.setItem('markdown-content', editor.value);
                alert('内容已保存到本地！');
            });

            // 导入
            importBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    editor.value = e.target.result;
                    isShowingGuide = false;
                    mdGuideBtn.textContent = 'Markdown 指南';
                    renderMarkdown(true);
                };
                reader.readAsText(file);
                fileInput.value = '';
            });

            // 导出
            exportBtn.addEventListener('click', () => {
                const blob = new Blob([editor.value], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${getFilename()}.md`;
                a.click();
                URL.revokeObjectURL(url);
            });
            
            exportHtmlBtn.addEventListener('click', () => {
                const filename = getFilename() + '.html';
                const htmlContent = `<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="UTF-8">\n<title>${filename}</title>\n<style>${document.querySelector('style').innerHTML}</style>\n</head>\n<body>\n<div class="markdown-body">${preview.innerHTML}</div>\n</body>\n</html>`;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            });

            exportPdfBtn.addEventListener('click', async () => {
                const btn = exportPdfBtn;
                btn.disabled = true;
                btn.textContent = '正在生成...';
                try {
                    const element = document.getElementById('preview');
                    const opt = {
                        margin: 15,
                        filename: `${getFilename()}.pdf`,
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    await html2pdf().from(element).set(opt).save();
                } catch (error) {
                    alert("PDF 导出失败");
                } finally {
                    btn.disabled = false;
                    btn.textContent = '导出 PDF';
                }
            });

            // 视图切换 - 修复核心逻辑
            function updateViewButtonsText() {
                // 修复按钮文字显示逻辑
                toggleEditorBtn.textContent = mainContainer.classList.contains('editor-hidden') 
                    ? '显示编辑区' 
                    : '隐藏编辑区';
                togglePreviewBtn.textContent = mainContainer.classList.contains('preview-hidden') 
                    ? '显示预览区' 
                    : '隐藏预览区';
                mdGuideBtn.textContent = isShowingGuide ? '返回编辑' : 'Markdown 指南';
            }

            // 修复编辑区切换逻辑
            toggleEditorBtn.addEventListener('click', function () {
                // 切换编辑区隐藏状态
                mainContainer.classList.toggle('editor-hidden');
                // 确保预览区状态正确（如果编辑区隐藏，预览区不能隐藏）
                if (mainContainer.classList.contains('editor-hidden')) {
                    mainContainer.classList.remove('preview-hidden');
                }
                updateViewButtonsText();
            });
            
            // 修复预览区切换逻辑
            togglePreviewBtn.addEventListener('click', function () {
                // 切换预览区隐藏状态
                mainContainer.classList.toggle('preview-hidden');
                // 确保编辑区状态正确（如果预览区隐藏，编辑区不能隐藏）
                if (mainContainer.classList.contains('preview-hidden')) {
                    mainContainer.classList.remove('editor-hidden');
                }
                updateViewButtonsText();
            });

            const markdownGuideContent = `# Markdown 语法指南
## 标题
# 一级标题
## 二级标题
### 三级标题

## 强调
*斜体* **粗体** ***粗斜体***

## 列表
- 项目1
- 项目2

1. 有序1
2. 有序2

## 链接
[名称](链接)

## 代码
\`代码\`

\`\`\`
代码块
\`\`\`

## 引用
> 引用内容
`;
            mdGuideBtn.addEventListener('click', () => {
                isShowingGuide = !isShowingGuide;
                if (isShowingGuide) {
                    userContentBeforeGuide = editor.value;
                    editor.value = markdownGuideContent;
                    renderMarkdown(false);
                } else {
                    editor.value = userContentBeforeGuide;
                    renderMarkdown(true);
                }
                updateViewButtonsText();
            });
            
            // 主题
            themeSelector.addEventListener('change', (e) => {
                document.body.className = '';
                document.body.classList.add(`theme-${e.target.value}`);
                localStorage.setItem('markdown-theme', e.target.value);
            });

            // 下拉菜单
            function closeAllDropdowns() {
                document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
            }
            dropdownToggles.forEach(toggle => {
                toggle.addEventListener('click', function(event) {
                    event.stopPropagation();
                    const currentMenu = this.nextElementSibling;
                    const isShown = currentMenu.classList.contains('show');
                    closeAllDropdowns();
                    if (!isShown) currentMenu.classList.add('show');
                });
            });
            window.addEventListener('click', closeAllDropdowns);

            // 同步滚动
            let isSyncScroll = true;
            let isPreviewScrolling = false;
            syncScrollToggle.addEventListener('change', function() {
                isSyncScroll = this.checked;
            });
            editor.addEventListener('scroll', function() {
                if (!isSyncScroll || isPreviewScrolling) return;
                const editorScroll = editor.scrollTop;
                const editorHeight = editor.scrollHeight - editor.clientHeight;
                const percent = editorHeight > 0 ? editorScroll / editorHeight : 0;
                const previewContainer = preview.parentElement;
                const previewHeight = previewContainer.scrollHeight - previewContainer.clientHeight;
                isPreviewScrolling = true;
                previewContainer.scrollTop = percent * previewHeight;
                setTimeout(() => { isPreviewScrolling = false; }, 10);
            });

            // ==============================================
            // 【终极关闭】sites 只允许手动点按钮才加载
            // ==============================================
            const loadSitesBtn = document.getElementById('loadSitesBtn');
            const saveToGithubBtn = document.getElementById('saveToGithubBtn');
            
            // 【关闭所有自动加载逻辑】一行自动请求都没有
            // 只有你手动点击才会运行！

            loadSitesBtn.onclick = async () => {
                try {
                    const res = await fetch("https://raw.githubusercontent.com/SelinuxJXM/Nav/main/docs/sites.txt");
                    // 修复：检查HTTP状态码，确保请求成功
                    if (!res.ok) throw new Error(`HTTP错误：${res.status}`);
                    const txt = await res.text();
                    editor.value = txt;
                    renderMarkdown();
                    alert("✅ 加载成功");
                } catch(e) {
                    console.error("加载失败详情：", e);
                    alert("❌ 加载失败，请检查网络或文件路径");
                }
            };

            saveToGithubBtn.onclick = async () => {
                let t = prompt("请输入 GitHub Token：");
                if(!t) return;
                
                try {
                    // 步骤1：获取文件当前SHA（确保最新）
                    let r = await fetch("https://api.github.com/repos/SelinuxJXM/Nav/contents/docs/sites.txt");
                    // 修复：检查SHA请求状态
                    if (!r.ok) throw new Error(`获取SHA失败：${r.status}`);
                    
                    let d = await r.json();
                    // 修复：处理GitHub API返回的编码问题
                    const content = btoa(unescape(encodeURIComponent(editor.value)));
                    
                    // 步骤2：构建PUT请求（严格遵循GitHub API规范）
                    let resp = await fetch("https://api.github.com/repos/SelinuxJXM/Nav/contents/docs/sites.txt", {
                        method: "PUT",
                        headers: { 
                            "Authorization": `token ${t}`, 
                            "Content-Type": "application/json",
                            "Accept": "application/vnd.github.v3+json" // 强制使用v3 API
                        },
                        body: JSON.stringify({ 
                            message: "更新 sites.txt", // 明确的提交信息
                            content: content, 
                            sha: d.sha,
                            branch: "main" // 明确指定分支（避免默认分支问题）
                        })
                    });
                    
                    // 修复：详细处理响应状态
                    if(resp.ok) {
                        alert("✅ 保存成功！");
                        // 同步更新本地缓存，确保前后端一致
                        localStorage.setItem('markdown-content', editor.value);
                    } else {
                        const errData = await resp.json();
                        console.error("保存失败详情：", errData);
                        alert(`❌ 保存失败：${errData.message || resp.statusText}`);
                    }
                } catch(e) { 
                    console.error("保存出错详情：", e);
                    alert("❌ 出错：" + e.message); 
                }
            };
            
            // 初始化视图按钮文字
            updateViewButtonsText();
        });
    </script>
</body>
</html>
