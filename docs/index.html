<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YSK Nav</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 
                        paper: '#f0f2f5', 
                        ink: '#1a1a1a', 
                        kblue: '#0052cc',
                        dark: {
                            paper: '#121212',
                            ink: '#f5f5f5',
                            card: '#1e1e1e',
                            border: '#333333',
                            slate100: '#2a2a2a',
                            slate200: '#444444',
                            slate400: '#777777',
                            slate50: '#1a1a1a'
                        }
                    },
                    fontFamily: { sans: ['"Noto Sans SC"', 'sans-serif'], mono: ['"Space Grotesk"', 'monospace'] },
                    borderRadius: { 'xl-brutal': '16px' }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f0f2f5; 
            color: #1a1a1a; 
            scroll-behavior: smooth; 
            -webkit-tap-highlight-color: transparent; 
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        body.dark {
            background-color: #121212;
            color: #f5f5f5;
        }
        section { content-visibility: auto; contain-intrinsic-size: 1px 500px; scroll-margin-top: 100px; }
        .brutal-card { 
            background: #fff; 
            border: 1.5px solid #e2e8f0; 
            border-radius: 16px; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .dark .brutal-card {
            background: #1e1e1e;
            border-color: #333333;
        }
        @media (min-width: 1024px) {
            .brutal-card:hover { transform: translateY(-2px); border-color: #0052cc; box-shadow: 0 10px 15px -3px rgba(0, 82, 200, 0.1); }
            .dark .brutal-card:hover { box-shadow: 0 10px 15px -3px rgba(0, 82, 200, 0.2); }
        }
        .nav-item { border-radius: 10px; margin: 2px 8px; transition: all 0.2s; cursor: pointer; }
        .nav-item:hover, .nav-item.active { background-color: #0052cc; color: #fff; }
        .nav-subitem { border-radius: 8px; margin: 1px 8px 1px 16px; transition: all 0.2s; cursor: pointer; padding: 2px 5px; }
        .nav-subitem:hover { background-color: #0052cc; color: #fff; }
        .dark .nav-subitem:hover { background-color: #0052cc; color: #fff; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #555555; }
        #mobileDrawer { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #mobileDrawer.open { transform: translateY(0); }
        .icon-loaded { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }
        .dark header {
            background-color: rgba(30, 30, 30, 0.7);
            border-b-color: #333333;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        header {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .dark .bg-slate-100 {
            background-color: #2a2a2a !important;
        }
        .dark .text-slate-400 {
            color: #888888 !important;
        }
        .dark .text-slate-600 {
            color: #dddddd !important;
        }
        .dark .text-slate-800 {
            color: #f5f5f5 !important;
        }
        .dark .text-slate-700 {
            color: #eeeeee !important;
        }
        .dark input {
            color: #f5f5f5 !important;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .dark input::placeholder {
            color: #888888 !important;
        }
        .dark #emptyState .bg-white {
            background-color: #1e1e1e;
            border-color: #444444;
        }
        .dark #emptyState .text-slate-300 {
            color: #777777 !important;
        }
        .dark #emptyState .text-slate-400 {
            color: #999999 !important;
        }
        .dark .border-slate-200 {
            border-color: #333333 !important;
        }
        .dark .border-slate-50 {
            border-color: #2a2a2a !important;
        }
        .dark .bg-white {
            background-color: #1e1e1e !important;
        }
        .dark .site-icon-container {
            background-color: #2a2a2a !important;
            border-color: #333333 !important;
        }
        #themeToggleBtn {
            transition: all 0.2s ease;
        }
        .category-level-1 {
            font-weight: bold;
            margin-top: 8px;
        }
        .category-level-2 {
            font-size: 11px;
            color: #666;
            margin-left: 12px;
        }
        .dark .category-level-2 {
            color: #aaa;
        }
        .subcategory-section {
            margin-left: 16px;
            margin-top: -2px;
            margin-bottom: 8px;
        }
        .subcategory-title {
            font-size: 10px;
            font-weight: 600;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dark .subcategory-title {
            color: #777;
        }
    </style>
</head>
<body class="min-h-screen font-sans text-sm pb-10">
    <header class="sticky top-0 z-40 bg-white/70 backdrop-blur-md border-b border-slate-200 px-4 md:px-6 py-3">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center gap-2 md:gap-4">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 bg-kblue rounded-lg flex items-center justify-center text-white italic font-black text-xs shrink-0">S</div>
                <h1 class="font-bold text-base md:text-lg tracking-tight hidden sm:block text-ink">YSK Nav</h1>
            </div>
            <div class="flex items-center gap-2 flex-grow justify-end max-w-2xl">
                <div class="relative flex-grow">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="searchInput" placeholder="搜索资源..." class="w-full bg-slate-100 border-none rounded-xl py-2 pl-10 pr-4 text-xs font-medium focus:ring-2 focus:ring-kblue/20 transition-all outline-none">
                </div>
                <button id="themeToggleBtn" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors shrink-0">
                    <i data-lucide="moon" id="themeIcon" class="w-5 h-5 text-slate-600"></i>
                </button>
                <button id="mobileMenuBtn" class="lg:hidden p-2 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors shrink-0">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-slate-600"></i>
                </button>
            </div>
        </div>
    </header>
    <div class="max-w-[1600px] mx-auto flex gap-6 p-4 md:p-6">
        <aside class="hidden lg:block w-56 shrink-0">
            <div class="sticky top-24 flex flex-col bg-white border border-slate-200 rounded-2xl shadow-sm h-[calc(100vh-120px)] overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-50 flex justify-between items-center shrink-0">
                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">分类索引</span>
                    <span id="category-count" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-[10px] font-bold">0</span>
                </div>
                <div id="categoryMenuList" class="flex-grow overflow-y-auto no-scrollbar py-2 text-slate-600"></div>
            </div>
        </aside>
        <main class="flex-grow min-w-0">
            <div id="siteGrid" class="space-y-8 md:space-y-10"></div>
            <div id="emptyState" class="hidden py-40 text-center">
                <div class="bg-white inline-block px-10 py-6 rounded-3xl border border-dashed border-slate-300">
                    <i data-lucide="layers" class="w-10 h-10 mx-auto mb-4 text-slate-300"></i>
                    <p class="text-slate-400 font-bold italic">未发现匹配的导航资源</p>
                </div>
            </div>
        </main>
    </div>
    <div id="drawerOverlay" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity"></div>
    <div id="mobileDrawer" class="fixed bottom-0 left-0 right-0 bg-white z-50 rounded-t-[32px] p-6 max-h-[80vh] flex flex-col lg:hidden">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 shrink-0"></div>
        <h3 class="font-bold text-lg mb-4 px-2">分类索引</h3>
        <div id="mobileCategoryList" class="overflow-y-auto custom-scroll space-y-1"></div>
    </div>

    <script>
        let allData = [];
        const AVATAR_COLORS = ['#4776E6', '#8E54E9', '#11998e', '#38ef7d', '#F2994A', '#EB5757', '#2F80ED'];
        const avatarCache = new Map();

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlBody = document.body;
        
        function initTheme() {
            const savedTheme = localStorage.getItem('nav-theme');
            const isDarkMode = savedTheme === 'dark' || 
                              (savedTheme === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            htmlBody.classList.toggle('dark', isDarkMode);
            themeIcon.dataset.lucide = isDarkMode ? 'sun' : 'moon';
            lucide.createIcons();
            htmlBody.style.transition = 'background-color 0.3s ease, color 0.3s ease';
        }

        function toggleTheme() {
            const isDark = htmlBody.classList.toggle('dark');
            localStorage.setItem('nav-theme', isDark ? 'dark' : 'light');
            
            themeIcon.style.transition = 'transform 0.2s ease';
            themeIcon.style.transform = 'rotate(180deg)';
            setTimeout(() => {
                themeIcon.dataset.lucide = isDark ? 'sun' : 'moon';
                lucide.createIcons();
                themeIcon.style.transform = 'rotate(0)';
            }, 200);
        }

        themeToggleBtn.addEventListener('click', toggleTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('nav-theme')) {
                htmlBody.classList.toggle('dark', e.matches);
                themeIcon.dataset.lucide = e.matches ? 'sun' : 'moon';
                lucide.createIcons();
            }
        });

        function getAvatar(name) {
            if (avatarCache.has(name)) return avatarCache.get(name);
            const color = AVATAR_COLORS[name.length % AVATAR_COLORS.length];
            const char = name.charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="30" fill="${color}"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="50" font-weight="bold" fill="white" font-family="system-ui">${char}</text></svg>`;
            const base64 = `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
            avatarCache.set(name, base64);
            return base64;
        }

        const iconObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const realSrc = img.dataset.src;
                    if (realSrc) {
                        const tempImg = new Image();
                        tempImg.src = realSrc;
                        tempImg.onload = () => {
                            if (tempImg.naturalWidth > 16) {
                                img.src = realSrc;
                                img.classList.add('icon-loaded');
                            }
                            img.removeAttribute('data-src');
                        };
                        tempImg.onerror = () => img.removeAttribute('data-src');
                    }
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '300px' });

        // 修复：正确解析 #一级 / ##二级 格式
        function parseM3U(text) {
            const categories = [];
            let currentLevel1 = null;
            let currentLevel2 = null;
            let currentSites = [];

            const lines = text.split('\n').map(line => line.trim()).filter(line => line);

            lines.forEach(line => {
                if (line.startsWith('# ') && !line.startsWith('## ')) {
                    // 一级标题 # 工具
                    if (currentLevel2 && currentSites.length > 0) {
                        categories.push({
                            name: `${currentLevel1}/${currentLevel2}`,
                            sites: [...currentSites]
                        });
                        currentSites = [];
                    }
                    currentLevel1 = line.replace(/^#\s*/, '').trim();
                    currentLevel2 = null;
                } else if (line.startsWith('## ')) {
                    // 二级标题 ## 在线工具
                    if (currentLevel2 && currentSites.length > 0) {
                        categories.push({
                            name: `${currentLevel1}/${currentLevel2}`,
                            sites: [...currentSites]
                        });
                        currentSites = [];
                    }
                    currentLevel2 = line.replace(/^##\s*/, '').trim();
                } else if (!line.startsWith('#')) {
                    // 网站链接
                    if (!currentLevel1) currentLevel1 = '未分类';
                    if (!currentLevel2) currentLevel2 = '默认';
                    const parts = line.split(/[,|]/);
                    if (parts.length >= 2) {
                        currentSites.push({
                            name: parts[0].trim(),
                            url: parts[1].trim().startsWith('http') ? parts[1].trim() : 'https://' + parts[1].trim()
                            desc: parts[2] ? parts[2].trim() : ''
                        });
                    }
                }
            });

            // 处理最后一组
            if (currentLevel1 && currentLevel2 && currentSites.length > 0) {
                categories.push({
                    name: `${currentLevel1}/${currentLevel2}`,
                    sites: currentSites
                });
            }

            return categories;
        }

        // 修复：正确渲染多级分类菜单
        function renderMultiLevelCategories(data, container, isMobile = false) {
            const frag = document.createDocumentFragment();
            const categoryMap = new Map();

            // 构建一级-二级映射
            data.forEach((item, idx) => {
                const [level1, level2] = item.name.split('/').map(s => s.trim());
                if (!categoryMap.has(level1)) {
                    categoryMap.set(level1, []);
                }
                categoryMap.get(level1).push({
                    name: level2,
                    index: idx
                });
            });

            // 渲染一级和二级分类
            categoryMap.forEach((subs, level1Name) => {
                // 一级分类
                const item = document.createElement('div');
                item.className = isMobile 
                    ? "px-5 py-4 text-base font-medium border-b border-slate-50 active:bg-slate-100 rounded-xl category-level-1"
                    : "nav-item px-5 py-2.5 text-xs font-bold truncate category-level-1";
                item.innerText = level1Name;
                frag.appendChild(item);

                // 二级分类
                subs.forEach(sub => {
                    const subItem = document.createElement('div');
                    subItem.className = isMobile
                        ? "px-5 py-3 text-sm font-medium border-b border-slate-50 active:bg-slate-100 rounded-xl category-level-2"
                        : "nav-subitem px-5 py-2 text-xs truncate category-level-2";
                    subItem.innerText = sub.name;
                    const scrollTarget = () => document.getElementById(`section-${sub.index}`).offsetTop - (isMobile ? 90 : 100);
                    subItem.onclick = () => {
                        if (isMobile) toggleDrawer(false);
                        setTimeout(() => window.scrollTo({ top: scrollTarget(), behavior: 'smooth' }), isMobile ? 350 : 0);
                    };
                    frag.appendChild(subItem);
                });
            });

            container.innerHTML = '';
            container.appendChild(frag);
        }

        // 修复：正确渲染页面内容
        function render(data) {
            const grid = document.getElementById('siteGrid');
            const deskMenu = document.getElementById('categoryMenuList');
            const mobMenu = document.getElementById('mobileCategoryList');
            const gridFrag = document.createDocumentFragment();

            document.getElementById('category-count').innerText = data.length;
            renderMultiLevelCategories(data, deskMenu, false);
            renderMultiLevelCategories(data, mobMenu, true);

            data.forEach((cat, idx) => {
                const [level1, level2] = cat.name.split('/').map(s => s.trim());
                const section = document.createElement('section');
                section.id = `section-${idx}`;
                section.className = "space-y-4";

                section.innerHTML = `
                    <div class="subcategory-section">
                        <div class="subcategory-title">${level1} / ${level2}</div>
                    </div>
                `;

                const cardGrid = document.createElement('div');
                cardGrid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3 md:gap-4";

                cat.sites.forEach(site => {
                    const domain = new URL(site.url).hostname;
                    const placeholder = getAvatar(site.name);
                    const realIcon = `https://www.google.com/s2/favicons?domain=${domain}&sz=128&default=404`;
                    
                    const a = document.createElement('a');
                    a.href = site.url;
                    a.target="_blank";
                    a.className = "brutal-card p-3 flex items-center gap-3 group active:scale-[0.98] lg:active:scale-100 transition-transform";
                    a.innerHTML = `
                        <div class="w-10 h-10 rounded-xl overflow-hidden shrink-0 bg-slate-50 flex items-center justify-center border border-slate-100 site-icon-container">
                            <img src="${placeholder}" data-src="${realIcon}" class="w-6 h-6 object-contain site-icon" alt="">
                        </div>
                        <div class="min-w-0">
                            <div class="text-[11px] font-bold text-slate-700 truncate group-hover:text-kblue transition-colors">${site.name}</div>
                            <div class="text-[9px] text-slate-400 line-clamp-1">${site.desc || ''}</div>
                            <div class="text-[9px] text-slate-400 truncate font-mono">${domain}</div>
                        </div>
                    `;
                    cardGrid.appendChild(a);
                    iconObserver.observe(a.querySelector('.site-icon'));
                });
                section.appendChild(cardGrid);
                gridFrag.appendChild(section);
            });

            grid.innerHTML = '';
            grid.appendChild(gridFrag);
            document.getElementById('emptyState').classList.toggle('hidden', data.length > 0);
        }

        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        function toggleDrawer(isOpen) {
            if (isOpen) {
                drawerOverlay.classList.remove('hidden');
                setTimeout(() => { drawerOverlay.classList.add('opacity-100'); mobileDrawer.classList.add('open'); }, 10);
                document.body.style.overflow = 'hidden';
            } else {
                drawerOverlay.classList.remove('opacity-100');
                mobileDrawer.classList.remove('open');
                setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
                document.body.style.overflow = '';
            }
        }
        mobileMenuBtn.onclick = () => toggleDrawer(true);
        drawerOverlay.onclick = () => toggleDrawer(false);

        async function init() {
            lucide.createIcons();
            initTheme();
            try {
                const res = await fetch('sites.txt');
                const text = await res.text();
                allData = parseM3U(text);
                render(allData);
            } catch (err) { console.error("加载失败", err); }
        }

        let timer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                const q = e.target.value.toLowerCase();
                const filtered = allData.map(c => ({
                    ...c, sites: c.sites.filter(s => s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q))
                })).filter(c => c.sites.length > 0);
                render(filtered);
            }, 300);
        });

        window.onload = init;

        // 折叠/展开功能
        document.addEventListener('DOMContentLoaded', () => {
            function addCategoryToggle() {
                const deskCats = document.querySelectorAll('#categoryMenuList .category-level-1');
                const mobCats = document.querySelectorAll('#mobileCategoryList .category-level-1');

                function bindToggle(items, isMobile) {
                    items.forEach(item => {
                        let next = item.nextElementSibling;
                        let hasSub = false;
                        const subList = [];

                        while (next && next.classList.contains('category-level-2')) {
                            subList.push(next);
                            hasSub = true;
                            next = next.nextElementSibling;
                        }

                        if (hasSub) {
                            item.style.cursor = 'pointer';
                            item.style.display = 'flex';
                            item.style.justifyContent = 'space-between';
                            item.style.alignItems = 'center';

                            const arrow = document.createElement('span');
                            arrow.innerText = '▶';
                            arrow.style.fontSize = isMobile ? '14px' : '10px';
                            arrow.style.transition = 'transform 0.2s';
                            item.appendChild(arrow);

                            subList.forEach(sub => sub.style.display = 'none');
                            let folded = true;

                            item.onclick = (e) => {
                                if (e.target === item || e.target === arrow) {
                                    folded = !folded;
                                    arrow.style.transform = folded ? 'rotate(0deg)' : 'rotate(90deg)';
                                    subList.forEach(sub => sub.style.display = folded ? 'none' : 'block');
                                }
                            };
                        }
                    });
                }
                bindToggle(deskCats, false);
                bindToggle(mobCats, true);
            }

            const originalRender = window.render;
            window.render = function (data) {
                originalRender(data);
                setTimeout(addCategoryToggle, 0);
            };
        });
    </script>
</body>
</html>
