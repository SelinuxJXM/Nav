<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SelinuxJ Nav</title>
    <link rel="icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0052cc',
                        light: {
                            paper: '#f8fafc',
                            card: '#ffffff',
                            border: '#e2e8f0',
                            text: '#0f172a',
                            muted: '#64748b'
                        },
                        dark: {
                            paper: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f1f5f9',
                            muted: '#94a3b8'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans SC"', 'sans-serif'],
                        mono: ['"Space Grotesk"', 'monospace']
                    },
                    transitionProperty: {
                        'height': 'height',
                        'spacing': 'margin, padding'
                    }
                }
            }
        }
    </script>
    <style>
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        body {
            background-color: #f8fafc;
            color: #0f172a;
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }
        body.dark {
            background-color: #0f172a;
            color: #f1f5f9;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background: #475569; }
        #mobileDrawer { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #mobileDrawer.open { transform: translateY(0); }
        @keyframes fadeIn { from { opacity: 0.5; } to { opacity: 1; } }
        .icon-loaded { animation: fadeIn 0.4s ease-out; }
        .chevron-icon { transition: transform 0.2s ease; }
        .collapsed .chevron-icon { transform: rotate(-90deg); }
        .expanded .chevron-icon { transform: rotate(0deg); }
    </style>
</head>
<body class="min-h-screen font-sans text-sm pb-16">
    <!-- 顶部导航栏 -->
    <header class="sticky top-0 z-40 bg-light-card/80 dark:bg-dark-card/80 backdrop-blur-md border-b border-light-border dark:border-dark-border px-4 md:px-6 py-3">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center gap-2 md:gap-4">
            <div class="flex items-center gap-2 shrink-0">
                <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white italic font-black text-xs shrink-0">S</div>
                <h1 class="font-bold text-base md:text-lg tracking-tight hidden sm:block text-light-text dark:text-dark-text">SelinuxJ Nav</h1>
            </div>
            <div class="flex items-center gap-2 flex-grow justify-end max-w-2xl">
                <div class="relative flex-grow">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-light-muted dark:text-dark-muted"></i>
                    <input type="text" id="searchInput" placeholder="搜索资源..." class="w-full bg-slate-100 dark:bg-dark-border border-none rounded-xl py-2 pl-10 pr-4 text-xs font-medium focus:ring-2 focus:ring-primary/20 outline-none text-light-text dark:text-dark-text placeholder:text-light-muted dark:placeholder:text-dark-muted">
                </div>
                <button id="themeToggleBtn" class="p-2 bg-slate-100 dark:bg-dark-border hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl transition-colors shrink-0">
                    <i data-lucide="moon" id="themeIcon" class="w-5 h-5 text-slate-600 dark:text-dark-muted"></i>
                </button>
                <button id="mobileMenuBtn" class="lg:hidden p-2 bg-slate-100 dark:bg-dark-border hover:bg-slate-200 dark:hover:bg-slate-600 rounded-xl transition-colors shrink-0">
                    <i data-lucide="layout-grid" class="w-5 h-5 text-slate-600 dark:text-dark-muted"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-[1600px] mx-auto flex gap-6 p-4 md:p-6">
        <!-- 桌面端左侧多级分类栏 -->
        <aside class="hidden lg:block w-64 shrink-0">
            <div class="sticky top-24 flex flex-col bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-border rounded-2xl shadow-sm h-[calc(100vh-120px)] overflow-hidden">
                <div class="px-5 py-4 border-b border-light-border dark:border-dark-border flex justify-between items-center shrink-0">
                    <span class="text-[10px] font-black text-light-muted dark:text-dark-muted uppercase tracking-widest">分类索引</span>
                    <span id="category-count" class="bg-slate-100 dark:bg-dark-border text-light-muted dark:text-dark-muted px-2 py-0.5 rounded-full text-[10px] font-bold">0</span>
                </div>
                <div id="categoryMenuList" class="flex-grow overflow-y-auto custom-scroll py-3"></div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-grow min-w-0">
            <div id="siteGrid" class="space-y-10 md:space-y-12"></div>
            <div id="emptyState" class="hidden py-40 text-center">
                <div class="bg-light-card dark:bg-dark-card inline-block px-10 py-6 rounded-3xl border border-dashed border-light-border dark:border-dark-border">
                    <i data-lucide="search-x" class="w-10 h-10 mx-auto mb-4 text-light-muted dark:text-dark-muted"></i>
                    <p class="text-light-muted dark:text-dark-muted font-bold italic">未发现匹配的导航资源</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 移动端分类抽屉 -->
    <div id="drawerOverlay" class="fixed inset-0 bg-black/20 dark:bg-black/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity"></div>
    <div id="mobileDrawer" class="fixed bottom-0 left-0 right-0 bg-light-card dark:bg-dark-card z-50 rounded-t-[32px] p-6 max-h-[80vh] flex flex-col lg:hidden">
        <div class="w-12 h-1.5 bg-slate-200 dark:bg-dark-border rounded-full mx-auto mb-6 shrink-0"></div>
        <h3 class="font-bold text-lg mb-4 px-2 text-light-text dark:text-dark-text">分类索引</h3>
        <div id="mobileCategoryList" class="overflow-y-auto custom-scroll"></div>
    </div>

    <!-- 回到顶部按钮 -->
    <button id="backToTop" class="fixed bottom-6 right-6 p-3 rounded-full bg-primary text-white shadow-lg opacity-0 invisible transition-all z-30">
        <i data-lucide="chevron-up" class="w-5 h-5"></i>
    </button>

    <script>
        let allData = [];
        const AVATAR_COLORS = ['#4776E6', '#8E54E9', '#11998e', '#38ef7d', '#F2994A', '#EB5757', '#2F80ED', '#0052cc'];
        const avatarCache = new Map();

        // ========== 主题切换 ==========
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlBody = document.body;

        function initTheme() {
            const savedTheme = localStorage.getItem('nav-theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                htmlBody.classList.add('dark');
                themeIcon.dataset.lucide = 'sun';
            } else {
                htmlBody.classList.remove('dark');
                themeIcon.dataset.lucide = 'moon';
            }
            lucide.createIcons();
        }

        function toggleTheme() {
            const isDark = htmlBody.classList.toggle('dark');
            localStorage.setItem('nav-theme', isDark ? 'dark' : 'light');
            themeIcon.dataset.lucide = isDark ? 'sun' : 'moon';
            lucide.createIcons();
        }
        themeToggleBtn.addEventListener('click', toggleTheme);

        // ========== 工具函数 ==========
        function getAvatar(name) {
            if (avatarCache.has(name)) return avatarCache.get(name);
            const color = AVATAR_COLORS[name.length % AVATAR_COLORS.length];
            const char = name.charAt(0).toUpperCase();
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="12" fill="${color}"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="50" font-weight="bold" fill="white" font-family="system-ui">${char}</text></svg>`;
            const base64 = `data:image/svg+xml;base64,${btoa(unescape(encodeURIComponent(svg)))}`;
            avatarCache.set(name, base64);
            return base64;
        }

        // 图标懒加载
        const iconObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    const realSrc = img.dataset.src;
                    if (realSrc) {
                        const tempImg = new Image();
                        tempImg.src = realSrc;
                        tempImg.onload = () => {
                            if (tempImg.naturalWidth > 16) {
                                img.src = realSrc;
                                img.classList.add('icon-loaded');
                            }
                            img.removeAttribute('data-src');
                        };
                        tempImg.onerror = () => img.removeAttribute('data-src');
                    }
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '300px' });

        // ========== 解析&渲染 ==========
        function parseData(text) {
            const data = [];
            let currentCat = null;
            let currentSub = null;
            
            text.split('\n').forEach(line => {
                line = line.trim();
                if (!line || (line.startsWith('#') && line.length < 2)) return;

                // 一级分类 #
                if (line.startsWith('# ')) {
                    if (currentCat) {
                        if (currentSub && currentSub.sites.length) currentCat.children.push(currentSub);
                        if (currentCat.children.length) data.push(currentCat);
                    }
                    currentCat = { name: line.replace(/^#\s*/, '').trim(), children: [], sites: [] };
                    currentSub = null;
                }
                // 二级分类 ##
                else if (line.startsWith('## ')) {
                    if (!currentCat) currentCat = { name: '默认分类', children: [], sites: [] };
                    if (currentSub && currentSub.sites.length) currentCat.children.push(currentSub);
                    currentSub = { name: line.replace(/^##\s*/, '').trim(), sites: [] };
                }
                // 站点
                else {
                    const parts = line.split(/[,|]/);
                    if (parts.length >= 2) {
                        const site = {
                            name: parts[0].trim(),
                            url: parts[1].trim().startsWith('http') ? parts[1].trim() : 'https://' + parts[1].trim()
                        };
                        if (currentSub) currentSub.sites.push(site);
                        else if (currentCat) currentCat.sites.push(site);
                        else data.push({ name: '默认分类', children: [], sites: [site] });
                    }
                }
            });

            if (currentCat) {
                if (currentSub && currentSub.sites.length) currentCat.children.push(currentSub);
                if (currentCat.sites.length || currentCat.children.length) data.push(currentCat);
            }
            return data;
        }

        function render(data) {
            const grid = document.getElementById('siteGrid');
            const deskMenu = document.getElementById('categoryMenuList');
            const mobMenu = document.getElementById('mobileCategoryList');
            grid.innerHTML = ''; deskMenu.innerHTML = ''; mobMenu.innerHTML = '';

            let totalCat = 0;
            data.forEach((cat, catIdx) => {
                totalCat += cat.children.length || 1;
                // 渲染侧边栏一级分类
                renderSideCategory(cat, catIdx, deskMenu, mobMenu);
                // 渲染主内容区一级分类
                const section = document.createElement('section');
                section.id = `section-${catIdx}`;
                section.className = "space-y-4";
                section.innerHTML = `<div class="flex items-center gap-3"><h2 class="font-black text-base uppercase tracking-tighter text-light-text dark:text-dark-text">${cat.name}</h2><div class="h-px bg-light-border dark:border-dark-border flex-grow"></div></div>`;
                
                // 渲染二级分类分组
                if (cat.children.length) {
                    cat.children.forEach((sub, subIdx) => {
                        if (sub.sites.length === 0) return;
                        section.appendChild(createSubCategoryBlock(sub, catIdx, subIdx));
                    });
                } else if (cat.sites.length) {
                    section.appendChild(createSubCategoryBlock({name: '', sites: cat.sites}, catIdx, 0));
                }
                grid.appendChild(section);
            });

            document.getElementById('category-count').innerText = totalCat;
            document.getElementById('emptyState').classList.toggle('hidden', data.length > 0);
            lucide.createIcons();
            initScrollHighlight();
        }

        function createSubCategoryBlock(sub, catIdx, subIdx) {
            const block = document.createElement('div');
            block.id = `section-${catIdx}-${subIdx}`;
            block.className = "space-y-3";
            if (sub.name) {
                block.innerHTML = `<h3 class="text-sm font-semibold text-light-muted dark:text-dark-muted pl-2">${sub.name}</h3>`;
            }
            const cardGrid = document.createElement('div');
            cardGrid.className = "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-3 md:gap-4";
            
            sub.sites.forEach(site => {
                const domain = new URL(site.url).hostname;
                const placeholder = getAvatar(site.name);
                const realIcon = `https://www.google.com/s2/favicons?domain=${domain}&sz=128&default=404`;
                
                const a = document.createElement('a');
                a.href = site.url;
                a.target = "_blank";
                a.className = "brutal-card p-3 flex items-center gap-3 group active:scale-[0.98] transition-transform bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-border rounded-xl";
                a.innerHTML = `
                    <div class="w-10 h-10 rounded-xl overflow-hidden shrink-0 bg-slate-50 dark:bg-dark-border flex items-center justify-center border border-slate-100 dark:border-dark-border">
                        <img src="${placeholder}" data-src="${realIcon}" class="w-6 h-6 object-contain site-icon" alt="${site.name}">
                    </div>
                    <div class="min-w-0">
                        <div class="text-sm font-medium text-light-text dark:text-dark-text truncate group-hover:text-primary transition-colors" title="${site.name}">${site.name}</div>
                        <div class="text-xs text-light-muted dark:text-dark-muted truncate font-mono mt-0.5">${domain}</div>
                    </div>
                `;
                cardGrid.appendChild(a);
                iconObserver.observe(a.querySelector('.site-icon'));
            });
            block.appendChild(cardGrid);
            return block;
        }

        function renderSideCategory(cat, catIdx, parentDesk, parentMob) {
            // 桌面端侧边栏
            const deskCat = document.createElement('div');
            deskCat.className = "mb-1";
            const deskHead = document.createElement('div');
            deskHead.className = "nav-item px-4 py-2 text-sm font-bold truncate flex items-center justify-between cursor-pointer";
            deskHead.innerHTML = `${cat.name}<i data-lucide="chevron-down" class="chevron-icon w-3.5 h-3.5"></i>`;
            const deskBody = document.createElement('div');
            deskBody.className = "overflow-hidden pl-4";
            if (cat.children.length) {
                deskCat.classList.add('collapsed');
                deskHead.onclick = () => {
                    deskCat.classList.toggle('collapsed');
                    deskCat.classList.toggle('expanded');
                };
                cat.children.forEach((sub, subIdx) => {
                    const item = document.createElement('div');
                    item.className = "nav-item px-3 py-1.5 text-xs font-medium truncate";
                    item.innerText = sub.name;
                    item.dataset.target = `section-${catIdx}-${subIdx}`;
                    item.onclick = () => window.scrollTo({ top: document.getElementById(`section-${catIdx}-${subIdx}`).offsetTop - 110 });
                    deskBody.appendChild(item);
                });
            } else {
                deskCat.classList.add('expanded');
                const item = document.createElement('div');
                item.className = "nav-item px-3 py-1.5 text-xs font-medium truncate";
                item.innerText = cat.name;
                item.dataset.target = `section-${catIdx}`;
                item.onclick = () => window.scrollTo({ top: document.getElementById(`section-${catIdx}`).offsetTop - 110 });
                deskBody.appendChild(item);
            }
            deskCat.appendChild(deskHead);
            deskCat.appendChild(deskBody);
            parentDesk.appendChild(deskCat);

            // 移动端分类
            const mobCat = document.createElement('div');
            mobCat.className = "mb-2";
            const mobHead = document.createElement('div');
            mobHead.className = "px-4 py-3 text-base font-semibold flex items-center justify-between bg-slate-50 dark:bg-dark-border rounded-xl cursor-pointer";
            mobHead.innerHTML = `${cat.name}<i data-lucide="chevron-down" class="chevron-icon w-4 h-4"></i>`;
            const mobBody = document.createElement('div');
            mobBody.className = "overflow-hidden pl-3 mt-1";
            if (cat.children.length) {
                mobCat.classList.add('collapsed');
                mobHead.onclick = () => {
                    mobCat.classList.toggle('collapsed');
                    mobCat.classList.toggle('expanded');
                };
                cat.children.forEach((sub, subIdx) => {
                    const item = document.createElement('div');
                    item.className = "px-3 py-2.5 text-sm font-medium border-b border-slate-50 dark:border-dark-border last:border-0 rounded-lg";
                    item.innerText = sub.name;
                    item.dataset.target = `section-${catIdx}-${subIdx}`;
                    item.onclick = () => { toggleDrawer(false); setTimeout(() => window.scrollTo({ top: document.getElementById(`section-${catIdx}-${subIdx}`).offsetTop - 90 }), 350); };
                    mobBody.appendChild(item);
                });
            } else {
                mobCat.classList.add('expanded');
                const item = document.createElement('div');
                item.className = "px-3 py-2.5 text-sm font-medium border-b border-slate-50 dark:border-dark-border rounded-lg";
                item.innerText = cat.name;
                item.dataset.target = `section-${catIdx}`;
                item.onclick = () => { toggleDrawer(false); setTimeout(() => window.scrollTo({ top: document.getElementById(`section-${catIdx}`).offsetTop - 90 }), 350); };
                mobBody.appendChild(item);
            }
            mobCat.appendChild(mobHead);
            mobCat.appendChild(mobBody);
            parentMob.appendChild(mobCat);
        }

        // ========== 交互功能 ==========
        // 滚动自动高亮当前分类
        function initScrollHighlight() {
            const navItems = document.querySelectorAll('.nav-item');
            let currentId = '';
            window.addEventListener('scroll', () => {
                document.querySelectorAll('section, div[id^="section-"]').forEach(sec => {
                    const rect = sec.getBoundingClientRect();
                    if (rect.top <= 120 && rect.bottom >= 100) {
                        currentId = sec.id;
                    }
                });
                navItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.target === currentId);
                });
                // 控制回到顶部显示
                const backBtn = document.getElementById('backToTop');
                if (window.scrollY > 300) {
                    backBtn.classList.remove('opacity-0', 'invisible');
                    backBtn.classList.add('opacity-100', 'visible');
                } else {
                    backBtn.classList.add('opacity-0', 'invisible');
                    backBtn.classList.remove('opacity-100', 'visible');
                }
            });
        }

        // 移动端抽屉
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileDrawer = document.getElementById('mobileDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        function toggleDrawer(isOpen) {
            if (isOpen) {
                drawerOverlay.classList.remove('hidden');
                setTimeout(() => { drawerOverlay.classList.add('opacity-100'); mobileDrawer.classList.add('open'); }, 10);
                document.body.style.overflow = 'hidden';
            } else {
                drawerOverlay.classList.remove('opacity-100');
                mobileDrawer.classList.remove('open');
                setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
                document.body.style.overflow = '';
            }
        }
        mobileMenuBtn.onclick = () => toggleDrawer(true);
        drawerOverlay.onclick = () => toggleDrawer(false);

        // 回到顶部
        document.getElementById('backToTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

        // 搜索
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                const q = e.target.value.toLowerCase();
                if (!q) {
                    render(allData);
                    return;
                }
                // 深度过滤所有站点
                const filtered = allData.map(cat => {
                    // 过滤一级下的直接站点
                    const matchedSites = cat.sites.filter(s => 
                        s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q)
                    );
                    // 过滤二级分类下的站点
                    const matchedChildren = cat.children.map(sub => {
                        const matchedSubSites = sub.sites.filter(s => 
                            s.name.toLowerCase().includes(q) || s.url.toLowerCase().includes(q)
                        );
                        return matchedSubSites.length ? {...sub, sites: matchedSubSites} : null;
                    }).filter(Boolean);
                    if (matchedSites.length || matchedChildren.length) {
                        return {...cat, sites: matchedSites, children: matchedChildren};
                    }
                    return null;
                }).filter(Boolean);
                render(filtered);
            }, 300);
        });

        // ========== 初始化 ==========
        async function init() {
            lucide.createIcons();
            initTheme();
            try {
                const res = await fetch('sites.txt');
                const text = await res.text();
                allData = parseData(text);
                render(allData);
            } catch (err) { 
                console.error("导航数据加载失败", err); 
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
